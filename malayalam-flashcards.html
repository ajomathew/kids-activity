<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മലയാളം Flash Cards</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@300;400;600;700&family=Playfair+Display:wght@400;700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #161616;
            --surface2: #1e1e1e;
            --border: #2a2a2a;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --cream: #f5f0e8;
            --muted: #666;
            --text: #e8e2d8;
            --red: #e05252;
            --teal: #4ecdc4;
            --radius: 16px;
        }

        /* Light mode overrides */
        :root.light {
            --bg: #f7f3ec;
            --surface: #ffffff;
            --surface2: #f0ebe0;
            --border: #ddd5c4;
            --gold: #a07828;
            --gold-light: #b8922e;
            --cream: #1a1208;
            --muted: #999;
            --text: #2a2010;
            --red: #cc3333;
            --teal: #2a9d95;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            transition: background 0.3s ease;
        }

        body {
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Ambient background */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(ellipse, rgba(201, 168, 76, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            width: 100%;
            max-width: 800px;
            padding: 40px 24px 20px;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* Header controls */
        .header-controls {
            position: absolute;
            top: 18px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .top-bar-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .top-bar-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .control-icon {
            font-size: 15px;
            line-height: 1;
            transition: transform 0.4s ease;
        }

        .top-bar-btn:hover .control-icon {
            transform: scale(1.15);
        }

        #themeToggleBtn:hover .control-icon {
            transform: rotate(20deg);
        }

        @media (max-width: 520px) {
            .btn-label-text {
                display: none;
            }
            .top-bar-btn {
                padding: 6px 10px;
                gap: 0;
            }
            .header-controls {
                right: 12px;
                top: 12px;
            }
        }

        .logo-label {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.25em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Noto Sans Malayalam', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            color: var(--text);
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.1em;
        }

        /* Mode selector styles are now inline — see .mode-bar-inline */

        /* Main container */
        main {
            width: 100%;
            max-width: 800px;
            padding: 24px;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        /* Collapsible input section */
        .input-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .input-section:hover {
            border-color: #333;
        }

        .input-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .input-toggle:hover {
            color: var(--gold);
        }

        .input-toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-preview {
            font-family: 'Noto Sans Malayalam', sans-serif;
            font-size: 11px;
            letter-spacing: 0;
            color: var(--muted);
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-transform: none;
        }

        .chevron {
            font-size: 10px;
            transition: transform 0.3s ease;
            color: var(--muted);
            flex-shrink: 0;
        }

        .input-section.open .chevron {
            transform: rotate(180deg);
        }

        .input-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.3s ease;
            padding: 0 18px;
        }

        .input-section.open .input-body {
            max-height: 400px;
            padding: 0 18px 18px;
        }

        .input-label {
            font-size: 11px;
            letter-spacing: 0.2em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        textarea {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            color: var(--cream);
            font-family: 'Noto Sans Malayalam', sans-serif;
            font-size: 1.05rem;
            line-height: 1.8;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.2s;
            outline: none;
        }

        textarea::placeholder {
            color: var(--muted);
            font-size: 0.9rem;
        }

        textarea:focus {
            border-color: var(--gold);
        }

        .btn-generate {
            margin-top: 12px;
            width: 100%;
            padding: 13px;
            background: var(--gold);
            color: var(--bg);
            border: none;
            border-radius: 10px;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-generate:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        /* Inline mode bar — sits just above cardArea */
        .mode-bar-inline {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 8px 22px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.22s ease;
        }

        .mode-btn:hover {
            border-color: var(--gold);
            color: var(--gold-light);
        }

        .mode-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--bg);
            font-weight: 600;
        }

        /* Progress / counter bar */
        .progress-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
        }

        .counter-label {
            font-size: 11px;
            letter-spacing: 0.15em;
            color: var(--muted);
            white-space: nowrap;
        }

        .counter-label span {
            color: var(--gold-light);
            font-weight: 600;
        }

        .progress-wrap {
            flex: 1;
            background: var(--surface2);
            border-radius: 999px;
            height: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--teal));
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* Single card stage */
        .card-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Individual card */
        .flash-card {
            width: min(340px, 90vw);
            height: min(420px, 55vw + 160px);
            perspective: 900px;
            cursor: pointer;
            animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        .flash-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 28px 24px 20px;
            gap: 0;
        }

        .card-front {
            background: var(--surface);
            border: 1.5px solid var(--border);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .flash-card:hover .card-front {
            border-color: rgba(201, 168, 76, 0.5);
            box-shadow: 0 0 40px rgba(201, 168, 76, 0.08);
        }

        .card-back {
            background: var(--surface2);
            border: 1.5px solid var(--gold);
            transform: rotateY(180deg);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
        }

        :root.light .card-back {
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
        }

        /* The main word/letter — auto-sizing */
        .card-char {
            font-family: 'Noto Sans Malayalam', sans-serif;
            font-weight: 600;
            color: var(--gold-light);
            line-height: 1.25;
            text-align: center;
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            /* fluid: big for short words, smaller for long */
            font-size: clamp(1.2rem, 8vw, 3.8rem);
            /* container-relative shrink via JS */
        }

        .card-back .card-char {
            color: var(--gold-light);
        }

        .card-hint {
            margin-top: 14px;
            font-size: 10px;
            letter-spacing: 0.18em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .card-back .card-hint {
            color: var(--muted);
        }

        .card-tag {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 8px;
            letter-spacing: 0.15em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .card-num {
            position: absolute;
            top: 12px;
            left: 14px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--cream);
            opacity: 0.75;
        }

        /* Spell-out row */
        .spell-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            align-items: center;
            padding: 12px 8px 0;
            max-width: 100%;
        }

        .spell-letter {
            font-family: 'Noto Sans Malayalam', sans-serif;
            font-size: 1rem;
            color: var(--gold);
            background: transparent;
            border: 1px solid var(--gold);
            border-radius: 6px;
            padding: 3px 8px;
            opacity: 0;
            transform: translateY(8px) scale(0.8);
            animation: letterPop 0.25s ease forwards;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .spell-letter:hover {
            background: var(--gold);
            color: var(--bg);
            transform: translateY(0) scale(1.02);
        }

        @keyframes letterPop {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .spell-dot {
            font-size: 0.7rem;
            color: var(--muted);
            opacity: 0;
            animation: letterPop 0.2s ease forwards;
        }

        /* Speak button */
        .speak-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--gold);
            border-radius: 999px;
            color: var(--gold);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
            animation: letterPop 0.3s ease 650ms forwards;
        }

        .speak-btn:hover {
            background: var(--gold);
            color: var(--bg);
            border-color: var(--gold);
            transform: scale(1.05);
        }

        .speak-btn.speaking {
            background: var(--gold);
            color: #0d0d0d;
            border-color: var(--gold);
        }

        .speak-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
            flex-shrink: 0;
        }

        @keyframes wave {

            0%,
            100% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(2.2);
            }
        }

        .wave-bar {
            display: inline-block;
            width: 3px;
            height: 8px;
            background: currentColor;
            border-radius: 2px;
            margin: 0 1px;
            animation: wave 0.6s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) {
            animation-delay: 0.12s;
        }

        .wave-bar:nth-child(3) {
            animation-delay: 0.24s;
        }

        /* Nav controls */
        .nav-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(201, 168, 76, 0.08);
            transform: scale(1.08);
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: default;
        }

        .nav-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-dot.active {
            background: var(--gold);
            transform: scale(1.4);
        }

        .nav-dot.seen {
            background: var(--teal);
            opacity: 0.6;
        }

        /* Shuffle btn under nav */
        .shuffle-row {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            border-color: var(--teal);
            color: var(--teal);
        }

        /* Animate card in from side */
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(16px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-60px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .flash-card.enter-right {
            animation: slideInRight 0.3s cubic-bezier(0.34, 1.3, 0.64, 1) both;
        }

        .flash-card.enter-left {
            animation: slideInLeft 0.3s cubic-bezier(0.34, 1.3, 0.64, 1) both;
        }

        /* Empty / placeholder */
        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 13px;
            letter-spacing: 0.08em;
            line-height: 1.8;
        }

        /* Section heading */
        .section-title {
            font-size: 10px;
            letter-spacing: 0.25em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        footer {
            padding: 24px;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 500px) {
            .flash-card {
                width: 88vw;
                height: 56vw + 100px;
            }

            h1 {
                font-size: 1.8rem;
            }
        }



        /* Theme Dropdown Styles */
        .theme-dropdown-container {
            position: fixed;
            bottom: 14px;
            right: 14px;
            z-index: 99999;
            font-family: monospace;
        }

        .theme-dropdown-btn {
            background: transparent;
            border: 1.5px solid currentColor;
            color: inherit;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .theme-dropdown-btn:hover {
            opacity: 0.8;
        }

        .theme-dropdown-menu {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 8px;
            background: #1e1e2e;
            border: 1px solid #313244;
            border-radius: 8px;
            width: 300px;
            max-height: 250px;
            display: none;
            flex-direction: column;
            z-index: 9999;
            color: #cdd6f4;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .theme-dropdown-menu.show {
            display: flex;
        }

        .theme-search-wrapper {
            padding: 10px;
            border-bottom: 1px solid #313244;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-search-wrapper input {
            background: transparent;
            border: none;
            color: #cdd6f4;
            outline: none;
            width: 100%;
            font-family: monospace;
            font-size: 14px;
        }

        .theme-list {
            overflow-y: auto;
            padding: 5px 0;
        }

        .theme-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 13px;
            color: #cdd6f4;
        }

        .theme-item:hover,
        .theme-item.active {
            background: #313244;
        }

        .theme-circles {
            display: flex;
            gap: 4px;
            background: #11111b;
            padding: 4px;
            border-radius: 12px;
        }

        .theme-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        </style>
    <script src="themes.js"></script>
    <script src="analytics.js"></script>
</head>

<body>

    <header>
        <div class="logo-label">Learn Malayalam</div>
        <h1>മലയാളം Flash Cards</h1>
        <p class="subtitle">Paste a paragraph · tap to flip · hear it spoken</p>
        <div class="header-controls">
            <button class="top-bar-btn" id="muteToggleBtn" onclick="toggleMute()" title="Mute/Unmute audio">
                <span class="control-icon" id="muteIcon">🔊</span>
                <span class="btn-label-text" id="muteLabel">Sound On</span>
            </button>
            <button class="top-bar-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle light/dark mode">
                <span class="control-icon" id="themeIcon">🌙</span>
                <span class="btn-label-text" id="themeLabel">Light</span>
            </button>
        </div>
    </header>

    <main>
        <!-- Collapsible input -->
        <div class="input-section open" id="inputSection">
            <button class="input-toggle" onclick="toggleInput()">
                <span class="input-toggle-label">
                    ✎ &nbsp;Malayalam Paragraph
                    <span class="input-preview" id="inputPreview"></span>
                </span>
                <span class="chevron">▼</span>
            </button>
            <div class="input-body">
                <label class="input-label" for="mlInput">Enter text below</label>
                <textarea id="mlInput"
                    placeholder="ഇവിടെ മലയാളം ഖണ്ഡിക ടൈപ്പ് ചെയ്യുക...&#10;&#10;Example: കേരളം ദൈവത്തിന്റെ നാടാണ്"></textarea>
                <button class="btn-generate" onclick="generate()">
                    &#9654; Generate Flash Cards
                </button>
            </div>
        </div>

        <!-- Mode bar — always visible, sits just above the card area -->
        <div class="mode-bar-inline" id="modeBarInline">
            <button class="mode-btn active" id="btn-words" onclick="setMode('words')">
                &#9632; Word Cards
            </button>
            <button class="mode-btn" id="btn-letters" onclick="setMode('letters')">
                &#9650; Letter Cards
            </button>
        </div>



        <div id="cardArea"></div>
    </main>

    <footer>tap to flip &nbsp;·&nbsp; 🔊 tap speaker to hear &nbsp;·&nbsp; മലയാളം</footer>

    <!-- Theme Dropdown -->
    <div class="theme-dropdown-container">
        <button class="theme-dropdown-btn" id="themeDropdownBtn" onclick="toggleThemeDropdown()">
            🎨 Themes
        </button>
        <div class="theme-dropdown-menu" id="themeDropdownMenu">
            <div class="theme-search-wrapper">
                <span>🔍</span>
                <input type="text" id="themeSearch" placeholder="Search themes..." onkeyup="filterThemes()">
            </div>
            <div class="theme-list" id="themeList"></div>
        </div>
    </div>

    <script>
        let mode = 'words';
        let cards = [];
        let current = 0;
        let isFlipped = false;
        let seen = new Set();
        let lastDir = 1; // 1 = forward, -1 = back

        // ── Theme toggle ──────────────────────────────────────────
        let isLight = false;

        function toggleTheme() {
            isLight = !isLight;
            document.documentElement.classList.toggle('light', isLight);
            document.getElementById('themeIcon').textContent = isLight ? '☀️' : '🌙';
            document.getElementById('themeLabel').textContent = isLight ? 'Dark' : 'Light';
            localStorage.setItem('ml-theme', isLight ? 'light' : 'dark');
        }

        // Restore saved preference
        (function () {
            const saved = localStorage.getItem('ml-theme');
            if (saved === 'light') {
                isLight = true;
                document.documentElement.classList.add('light');
                document.addEventListener('DOMContentLoaded', () => {
                    const icon = document.getElementById('themeIcon');
                    const label = document.getElementById('themeLabel');
                    if (icon) icon.textContent = '☀️';
                    if (label) label.textContent = 'Dark';
                });
            }
        })();

        // ── Mute toggle ──────────────────────────────────────────
        let isMuted = false;
        let activeAudio = null;

        function toggleMute() {
            isMuted = !isMuted;
            localStorage.setItem('ml-muted', isMuted ? 'true' : 'false');
            updateMuteButton();
            if (isMuted) {
                if (synth) synth.cancel();
                if (activeAudio) {
                    activeAudio.pause();
                    activeAudio = null;
                }
            }
        }

        function updateMuteButton() {
            const icon = document.getElementById('muteIcon');
            const label = document.getElementById('muteLabel');
            if (icon && label) {
                icon.textContent = isMuted ? '🔇' : '🔊';
                label.textContent = isMuted ? 'Muted' : 'Sound On';
            }
        }

        // Restore saved mute preference
        (function () {
            const saved = localStorage.getItem('ml-muted');
            if (saved === 'true') {
                isMuted = true;
                document.addEventListener('DOMContentLoaded', () => {
                    updateMuteButton();
                });
            }
        })();

        // ── Theme Dropdown Engine ──────────────────────────────────────────
        let currentTheme = null;

        function toggleThemeDropdown() {
            const menu = document.getElementById('themeDropdownMenu');
            menu.classList.toggle('show');
        }

        function closeThemeDropdown() {
            document.getElementById('themeDropdownMenu').classList.remove('show');
        }

        function filterThemes() {
            const search = document.getElementById('themeSearch').value.toLowerCase();
            const items = document.querySelectorAll('.theme-item');
            items.forEach(item => {
                const name = item.textContent.toLowerCase();
                item.style.display = name.includes(search) ? 'flex' : 'none';
            });
        }

        function applyTheme(themeName, colors) {
            const root = document.documentElement;
            root.style.setProperty('--bg', colors.bg);
            root.style.setProperty('--gold', colors.main);
            root.style.setProperty('--teal', colors.sub);
            root.style.setProperty('--gold-light', colors.main);
            
            // Adjust text color based on bg luminance
            const r = parseInt(colors.bg.slice(1, 3), 16);
            const g = parseInt(colors.bg.slice(3, 5), 16);
            const b = parseInt(colors.bg.slice(5, 7), 16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            const textColor = luminance > 0.5 ? '#333' : '#ddd';
            root.style.setProperty('--text', textColor);
            root.style.setProperty('--muted', luminance > 0.5 ? '#666' : '#999');

            root.style.setProperty('--surface', colors.bg);
            root.style.setProperty('--surface2', colors.bg);
            root.style.setProperty('--border', colors.sub);

            currentTheme = themeName;
            localStorage.setItem('ml-current-theme', themeName);
            updateThemeMenuActiveState();
            closeThemeDropdown();
        }

        function updateThemeMenuActiveState() {
            const items = document.querySelectorAll('.theme-item');
            items.forEach(item => {
                item.classList.remove('active');
                if (item.dataset.theme === currentTheme) {
                    item.classList.add('active');
                }
            });
        }

        function initThemeDropdown() {
            const list = document.getElementById('themeList');
            if (typeof themesData !== 'undefined') {
                themesData.forEach(theme => {
                    const item = document.createElement('div');
                    item.className = 'theme-item';
                    item.dataset.theme = theme.value;
                    item.innerHTML = `
                        <span>${theme.name}</span>
                        <div class="theme-circles">
                            <div class="theme-circle" style="background-color: ${theme.colors.bg}"></div>
                            <div class="theme-circle" style="background-color: ${theme.colors.main}"></div>
                            <div class="theme-circle" style="background-color: ${theme.colors.sub}"></div>
                        </div>
                    `;
                    item.onclick = () => applyTheme(theme.value, theme.colors);
                    list.appendChild(item);
                });

                const saved = localStorage.getItem('ml-current-theme');
                if (saved) {
                    const savedTheme = themesData.find(t => t.value === saved);
                    if (savedTheme) {
                        applyTheme(saved, savedTheme.colors);
                    }
                }
            }
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const container = document.querySelector('.theme-dropdown-container');
            if (!container.contains(e.target)) {
                closeThemeDropdown();
            }
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initThemeDropdown);

        // ── Malayalam Grapheme Splitting ──────────────────────────────────────────
        function splitMalayalamGraphemes(text) {
            if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                const segmenter = new Intl.Segmenter('ml-IN', { granularity: 'grapheme' });
                return Array.from(segmenter.segment(text)).map(s => s.segment);
            }

            const graphemes = [];
            let current = '';
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const code = text.charCodeAt(i);
                
                // Combining marks for Malayalam
                const isCombining = (code >= 0x0D00 && code <= 0x0D03) ||
                                    (code >= 0x0D3B && code <= 0x0D4D) ||
                                    (code === 0x0D57 || code === 0x0D62 || code === 0x0D63) ||
                                    (code === 0x200D || code === 0x200C);
                
                if (!isCombining) {
                    if (current.length > 0) {
                        const lastCode = current.charCodeAt(current.length - 1);
                        // If previous character was Virama or ZWJ, do not split (forms a conjunct)
                        if (lastCode !== 0x0D4D && lastCode !== 0x200D) {
                            graphemes.push(current);
                            current = '';
                        }
                    }
                }
                current += char;
            }
            if (current.length > 0) {
                graphemes.push(current);
            }
            return graphemes;
        }

        function toggleInput() {
            const sec = document.getElementById('inputSection');
            sec.classList.toggle('open');
        }

        function collapseInput() {
            const sec = document.getElementById('inputSection');
            sec.classList.remove('open');
            // Show preview text in toggle bar
            const val = document.getElementById('mlInput').value.trim();
            const preview = document.getElementById('inputPreview');
            if (preview) preview.textContent = val.length > 30 ? '· ' + val.slice(0, 30) + '…' : val ? '· ' + val : '';
        }

        // ── TTS ───────────────────────────────────────────────────
        const synth = window.speechSynthesis;
        let mlVoice = null;
        let voiceLoadAttempts = 0;

        function loadVoices() {
            const v = synth ? synth.getVoices() : [];
            
            // iOS fix: voices may be empty initially, retry a few times
            if (v.length === 0 && voiceLoadAttempts < 5) {
                voiceLoadAttempts++;
                setTimeout(loadVoices, 100);
                return;
            }
            
            // Reset counter after successful load
            voiceLoadAttempts = 0;
            
            // Prefer explicit Malayalam voices, then any voice that starts with 'ml',
            // then Hindi or Indian English as fallback, then any available voice.
            mlVoice = v.find(x => x.lang === 'ml-IN' || x.lang === 'ml')
                || v.find(x => x.lang.startsWith('ml'))
                || v.find(x => x.lang === 'hi-IN' || x.lang.startsWith('hi'))
                || v.find(x => x.lang === 'en-IN' || x.lang.startsWith('en-IN'))
                || v.find(x => x.lang.startsWith('en'))
                || v[0];
        }

        synth?.addEventListener?.('voiceschanged', loadVoices);
        loadVoices();

        function speak(text, force = false) {
            if (isMuted && !force) return;

            // Stop any playing fallback audio
            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
            }

            const v = synth ? synth.getVoices() : [];
            const hasMalayalam = v.some(x => x.lang.startsWith('ml'));

            // If the device (like iOS) doesn't have a native Malayalam voice, 
            // fallback to an online text-to-speech service (Google Translate).
            if (!hasMalayalam && navigator.onLine) {
                const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ml&client=tw-ob&q=${encodeURIComponent(text)}`;
                const audio = new Audio(url);
                activeAudio = audio;
                audio.playbackRate = 0.85; // Slow it down slightly to match flashcard pacing
                audio.play()
                    .then(() => {
                        audio.onended = () => {
                            if (activeAudio === audio) activeAudio = null;
                        };
                    })
                    .catch(e => {
                        console.warn("Audio fallback failed:", e);
                        if (activeAudio === audio) activeAudio = null;
                    });
                return;
            }

            if (!synth) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ml-IN';
            if (mlVoice) utterance.voice = mlVoice;
            utterance.rate = 0.8;
            synth.speak(utterance);
        }

        function generate() {
            const input = document.getElementById('mlInput').value.trim();
            if (!input) {
                alert('Please enter Malayalam text');
                return;
            }

            // Split by spaces to create word cards initially
            cards = input.split(/\s+/).filter(w => w.length > 0);
            current = 0;
            seen.clear();
            isFlipped = false;
            collapseInput();
            render();
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btn-words').classList.toggle('active', m === 'words');
            document.getElementById('btn-letters').classList.toggle('active', m === 'letters');
            isFlipped = false;
            current = 0;
            seen.clear();

            // Convert cards based on mode
            const originalCards = document.getElementById('mlInput').value.trim().split(/\s+/).filter(w => w.length > 0);
            if (mode === 'letters') {
                cards = [];
                originalCards.forEach(word => {
                    cards.push(...splitMalayalamGraphemes(word));
                });
            } else {
                cards = originalCards;
            }
            render();
        }

        function render() {
            const area = document.getElementById('cardArea');

            if (cards.length === 0) {
                area.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <p>No cards yet. Paste some Malayalam text above and hit "Generate".</p>
                    </div>
                `;
                return;
            }

            const card = cards[current];
            const progress = ((current + 1) / cards.length) * 100;

            area.innerHTML = `
                <div class="progress-header">
                    <span class="counter-label"><span>${current + 1}</span> / ${cards.length}</span>
                    <div class="progress-wrap">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                </div>

                <div class="card-stage">
                    <div class="flash-card" id="mainCard" onclick="flipCard()">
                        <div class="card-inner">
                            <div class="card-front">
                                <span class="card-num">${current + 1}</span>
                                <div class="card-char">${card}</div>
                                <div class="card-hint">${mode === 'letters' ? 'Letter' : 'Word'}</div>
                            </div>
                            <div class="card-back">
                                <span class="card-num">${current + 1}</span>
                                <div class="card-char">${card}</div>
                                <div class="spell-row" id="spellRow"></div>
                                <button class="speak-btn" onclick="speak('${card.replace(/'/g, "\\'")}', true); event.stopPropagation();">
                                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                    Speak
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="nav-row">
                        <button class="nav-btn" onclick="prevCard()" ${current === 0 ? 'disabled' : ''}>←</button>
                        <div class="nav-dots">
                            ${cards.map((_, i) => `<div class="nav-dot ${i === current ? 'active' : ''} ${seen.has(i) ? 'seen' : ''}" onclick="goTo(${i})"></div>`).join('')}
                        </div>
                        <button class="nav-btn" onclick="nextCard()" ${current === cards.length - 1 ? 'disabled' : ''}>→</button>
                    </div>

                    <div class="shuffle-row">
                        <button class="ctrl-btn" onclick="shuffleCards()">🔀 Shuffle</button>
                        <button class="ctrl-btn" onclick="resetCards()">↻ Reset</button>
                    </div>
                </div>
            `;

            // Populate spell-out row for back side
            if (isFlipped) {
                const spellRow = document.getElementById('spellRow');
                const graphemes = splitMalayalamGraphemes(card);
                spellRow.innerHTML = graphemes.map((g, i) => 
                    `<span class="spell-letter" style="animation-delay: ${i * 0.15}s">${g}</span>`
                ).join('');
            }
        }

        function flipCard() {
            if (isFlipped) {
                nextCard();
                return;
            }
            
            isFlipped = true;
            const card = document.getElementById('mainCard');
            card.classList.add('flipped');
            seen.add(current);
            const spellRow = document.getElementById('spellRow');
            const graphemes = splitMalayalamGraphemes(cards[current]);
            spellRow.innerHTML = graphemes.map((g, i) => 
                `<span class="spell-letter" style="animation-delay: ${i * 0.15}s" onclick="speak('${g.replace(/'/g, "\\'")}', true); event.stopPropagation();">${g}</span>`
            ).join('');
            
            // Automatically speak the word when flipped
            speak(cards[current]);
        }

        function nextCard() {
            if (current < cards.length - 1) {
                lastDir = 1;
                current++;
                isFlipped = false;
                render();
                document.getElementById('mainCard')?.classList.add('enter-right');
            }
        }

        function prevCard() {
            if (current > 0) {
                lastDir = -1;
                current--;
                isFlipped = false;
                render();
                document.getElementById('mainCard')?.classList.add('enter-left');
            }
        }

        function goTo(idx) {
            current = idx;
            isFlipped = false;
            render();
        }

        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            current = 0;
            isFlipped = false;
            seen.clear();
            render();
        }

        function resetCards() {
            current = 0;
            isFlipped = false;
            seen.clear();
            render();
        }
    </script>
</body>

</html>
